name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

# The jobs only read the code. No job gets a token that can write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to a commit so a moved tag can't change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # package.json's engines field is the one place the Node version is set. Vercel reads it too.
          node-version-file: package.json
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm test
      - run: npm run build
